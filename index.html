<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polkadot Ecosystem Videos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="background-gradient"></div>

    <header class="glass-header">
        <div class="container">
            <div class="logo-area">
                <svg class="polkadot-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="40" fill="#E6007A" />
                    <circle cx="35" cy="35" r="5" fill="white" />
                    <circle cx="65" cy="65" r="5" fill="white" />
                    <circle cx="65" cy="35" r="5" fill="white" fill-opacity="0.5" />
                    <circle cx="35" cy="65" r="5" fill="white" fill-opacity="0.5" />
                </svg>
                <h1>Polkadot Ecosystem Videos</h1>
            </div>
            <p class="subtitle">Public videos funded by Polkadot OpenGov</p>
        </div>
    </header>

    <main class="container">
        <div id="video-grid" class="video-grid">
            <!-- Video cards will be injected here -->
        </div>
    </main>

    <footer class="glass-footer">
        <div class="container">
            <p>&copy; 2026 Polkadot Ecosystem. All rights reserved.</p>
            <p class="tiny-text">Hosted on GitHub Pages</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>

</html>
